name: PunchSnowball
version: 1.2.0
main: com.example.punchsnowball.PunchSnowballPlugin
api-version: '1.21.11'
description: Infinite punch snowball and reusable enchanted TNT
commands:
  givesnowball:
    description: Gives a player an infinite Punch Snowball
    usage: /givesnowball [player]
    permission: punchsnowball.give
  givetnt:
    description: Gives a player a reusable Infinite TNT
    usage: /givetnt [player]
    permission: punchsnowball.give
permissions:
  punchsnowball.give:
    description: Allows giving custom items
    default: op
